[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-pln"
version = "0.1.0"
description = "Modulo de PLN da plataforma Elo: classificacao de sentimento, aspectos e reputacao textual"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
mysql = [
    "PyMySQL>=1.1",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
elo-pln = "pln.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
